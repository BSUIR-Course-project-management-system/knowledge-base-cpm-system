services:
  ollama:
    image: ollama/ollama:latest
    container_name: project-ideas-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  model-init:
    image: ollama/ollama:latest
    container_name: project-ideas-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_NAME: ${LLM_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${MODEL_NAME}\""]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: project-ideas-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LLM_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ollama_data:
