services:
  docs-finder-service:
    build:
      context: .
      args:
        MODEL_NAME: BAAI/bge-m3
    container_name: docs-finder-service
    ports:
      - "8003:8003"
    environment:
      OPENALEX_BASE_URL: https://api.openalex.org/works
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-}
      OPENALEX_TIMEOUT: 25
      OPENALEX_RETRIES: 2
      MODEL_NAME: BAAI/bge-m3
      HF_HOME: /models
      CANDIDATE_LIMIT: 50
    restart: unless-stopped

