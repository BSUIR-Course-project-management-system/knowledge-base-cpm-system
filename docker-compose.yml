services:
  db:
    image: postgres:16
    container_name: course_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in root .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    env_file:
      - ./api-gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      data-storage-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      explanatory-note-service:
        condition: service_healthy

  user-service:
    build: ./user-service
    env_file:
      - ./user-service/.env
    container_name: user-service
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  search-service:
    build: ./search-service
    container_name: search-service
    ports:
      - "8002:8002"
    volumes:
      - chroma_data:/app/app/search_module/chroma_db
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  data-storage-service:
    build: ./data-storage-service
    container_name: data-storage-service
    env_file:
      - ./data-storage-service/.env
    environment:
      DATA_DIR: /data
      CREDENTIALS_PATH: /secrets/credentials.json
    ports:
      - "8003:8003"
    volumes:
      - ./data-storage-service/data:/data
      - ./data-storage-service/secrets:/secrets:ro
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8003/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  schedule-service:
    build: ./schedule-service
    container_name: schedule-service
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  explanatory-note-service:
    build: ./explanatory-note-service
    container_name: explanatory-note-service
    env_file:
      - ./explanatory-note-service/.env
    environment:
      OUTPUT_DIR: /app/out
    volumes:
      - ./generated-tex:/app/out
    ports:
      - "8005:8005"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8005/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  chroma_data:
