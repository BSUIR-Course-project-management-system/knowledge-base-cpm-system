services:
  db:
    image: postgres:16
    container_name: course_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in root .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in root .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    env_file:
      - ./api-gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      data-storage-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      schedule-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      explanatory-note-service:
        condition: service_healthy
      theme-generator-service:
        condition: service_healthy

  user-service:
    build: ./user-service
    env_file:
      - ./user-service/.env
    container_name: user-service
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  search-service:
    build: ./search-service
    container_name: search-service
    ports:
      - "8002:8002"
    volumes:
      - chroma_data:/app/app/search_module/chroma_db
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  data-storage-service:
    build: ./data-storage-service
    container_name: data-storage-service
    env_file:
      - ./data-storage-service/.env
    environment:
      DATA_DIR: /data
      CREDENTIALS_PATH: /secrets/credentials.json
    ports:
      - "8003:8003"
    volumes:
      - ./data-storage-service/data:/data
      - ./data-storage-service/secrets:/secrets:ro
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8003/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  schedule-service:
    build: ./schedule-service
    container_name: schedule-service
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  explanatory-note-service:
    build: ./explanatory-note-service
    container_name: explanatory-note-service
    env_file:
      - ./explanatory-note-service/.env
    environment:
      OUTPUT_DIR: /app/out
    volumes:
      - ./generated-tex:/app/out
    ports:
      - "8005:8005"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8005/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  theme-generator-service:
    build: ./theme-generator-service
    container_name: theme-generator-service
    restart: unless-stopped
    env_file:
      - ./theme-generator-service/.env
    environment:
      LLM_BASE_URL: http://ollama:11434
    ports:
      - "8006:8006"
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8006/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    container_name: project-ideas-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  model-init:
    image: ollama/ollama:latest
    container_name: project-ideas-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_NAME: ${LLM_MODEL:-qwen3:4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${MODEL_NAME}\""]
    restart: "no"

volumes:
  postgres_data:
  chroma_data:
  ollama_data:
